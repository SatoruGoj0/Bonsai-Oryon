name: model-validation (opt-in, real 9B model)

# Manually triggered only. Downloads prism-ml/Ternary-Bonsai-2-9B-gguf / Ternary-Bonsai-2-9B-PQ2_0.gguf
# (about 2.4 GB) from Hugging Face onto the runner. Nothing is cached, uploaded or redistributed.
# Justification: the only way to check end-to-end numerical compatibility (KL divergence of
# full-vocabulary logits) of the optimized kernels against unpatched upstream kernels on the REAL
# model, and to get like-for-like A/B numbers on ARM64 hardware. The runner is a generic
# 4-vCPU Arm Neoverse N2 VM, so these are NOT Snapdragon X numbers.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Run ID of a successful build-test-release run whose engine-bin/baseline-bin artifacts to use'
        required: true

permissions:
  contents: read
  actions: read

env:
  MODEL_URL: https://huggingface.co/prism-ml/Ternary-Bonsai-2-9B-gguf/resolve/main/Ternary-Bonsai-2-9B-PQ2_0.gguf

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates python3 python3-numpy python3-yaml curl libgomp1 time iproute2
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with: { name: engine-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { name: baseline-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - run: mkdir -p opt base && tar -C opt -xzf engine-bin.tgz && tar -C base -xzf baseline-bin.tgz
      - name: download model (not redistributed)
        run: |
          mkdir -p /models
          curl -fL --retry 5 -o /models/bonsai.gguf "$MODEL_URL"
          ls -la /models; sha256sum /models/bonsai.gguf
      - name: inspect tensor types and PQ2_0 code usage (is the checkpoint strictly ternary?)
        continue-on-error: true
        run: |
          mkdir -p results
          python3 - <<'PY' | tee results/model-tensors.md
          import sys, collections
          import numpy as np
          sys.path.insert(0, "upstream/llama.cpp/gguf-py")
          import gguf
          r = gguf.GGUFReader("/models/bonsai.gguf")
          arch = r.fields["general.architecture"]; print("architecture:", bytes(arch.parts[arch.data[0]]).decode())
          by = collections.defaultdict(lambda: [0, 0])
          codes = np.zeros(4, dtype=np.int64)
          for t in r.tensors:
              by[t.tensor_type.name][0] += 1; by[t.tensor_type.name][1] += int(t.n_bytes)
              if t.tensor_type.name == "PQ2_0":
                  raw = np.asarray(t.data, dtype=np.uint8).reshape(-1, 34)[:, 2:]
                  for j in range(4):
                      codes += np.bincount(((raw >> (2 * j)) & 3).ravel(), minlength=4)
          print("| type | tensors | MiB |\n|---|---|---|")
          for k, (n, b) in sorted(by.items(), key=lambda kv: -kv[1][1]): print(f"| {k} | {n} | {b/2**20:.1f} |")
          tot = codes.sum()
          print("\nPQ2_0 code histogram (value = code-1):", {f"{c-1:+d}": f"{codes[c]/tot*100:.3f}%" for c in range(4)})
          print("strictly ternary (no +2 codes):", codes[3] == 0)
          for t in r.tensors:
              if t.name in ("token_embd.weight", "output.weight"): print(f"- {t.name}: {t.tensor_type.name} {list(t.shape)}")
          PY
      - name: numerical compatibility on the real model (KL divergence vs unpatched kernels)
        run: |
          cat upstream/llama.cpp/README.md upstream/llama.cpp/docs/build.md > /tmp/text.txt
          echo "### real-model numerical compatibility, v0.2 default kernels vs unpatched e3de715 kernels" > results/real-numerics.md
          BASE_BACKEND_DIR=$PWD/base/bin OPT_BACKEND_DIR=$PWD/opt/bin THREADS=4 CTX=256 CHUNKS=4 MAX_KLD=0.001 MIN_TOP1=98 \
            tests/numerics/compare-kld.sh base/bin/llama-perplexity opt/bin/llama-perplexity /models/bonsai.gguf /tmp/text.txt results/real-numerics.md
      - name: numerical compatibility, opt-in ternary layout vs unpatched kernels
        run: |
          echo "### real-model numerical compatibility, ternary 4-row layout (BONSAI_PQ2_TERNARY=1) vs unpatched e3de715 kernels" > results/real-numerics-ternary.md
          BONSAI_PQ2_TERNARY=1 BASE_BACKEND_DIR=$PWD/base/bin OPT_BACKEND_DIR=$PWD/opt/bin THREADS=4 CTX=256 CHUNKS=4 MAX_KLD=0.001 MIN_TOP1=98 \
            tests/numerics/compare-kld.sh base/bin/llama-perplexity opt/bin/llama-perplexity /models/bonsai.gguf /tmp/text.txt results/real-numerics-ternary.md
      - name: A/B on the real model, threads 1/2/4 (runner CPU, 3 reps)
        run: |
          R=results/real-ab.md
          { echo "### real-model A/B, $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU - NOT Snapdragon X"; echo
            echo "| build | threads | pp256 tok/s | tg128 tok/s |"; echo "|---|---|---|---|"; } > $R
          ab() { # label dir env...
            lab=$1; d=$2; shift 2; l=$(echo "$lab" | tr -c 'A-Za-z0-9\n' '_')
            env "$@" LD_LIBRARY_PATH=$PWD/$d/bin BONSAI_BACKEND_DIR=$PWD/$d/bin $d/bin/llama-bench -m /models/bonsai.gguf \
              -t 1,2,4 -ngl 0 -p 256 -n 128 -r 3 -o json > /tmp/$l.json 2>/tmp/$l.log || { tail /tmp/$l.log; return 1; }
            python3 - /tmp/$l.json "$lab" >> $R <<'PY'
          import json, sys
          rows = {}
          for r in json.load(open(sys.argv[1])):
              rows.setdefault(r["n_threads"], {})["pp" if r["n_prompt"] else "tg"] = "%.2f ± %.2f" % (r["avg_ts"], r["stddev_ts"])
          for t in sorted(rows): print(f"| {sys.argv[2]} | {t} | {rows[t].get('pp')} | {rows[t].get('tg')} |")
          PY
          }
          abd() { # label libdir-for-backends env... (binaries from opt/bin)
            lab=$1; d=$2; shift 2; l=$(echo "$lab" | tr -c 'A-Za-z0-9\n' '_')
            env "$@" LD_LIBRARY_PATH=$PWD/opt/bin BONSAI_BACKEND_DIR=$PWD/$d opt/bin/llama-bench -m /models/bonsai.gguf \
              -t 1,2,4 -ngl 0 -p 256 -n 128 -r 3 -o json > /tmp/$l.json 2>/tmp/$l.log || { tail /tmp/$l.log; return 1; }
            python3 - /tmp/$l.json "$lab" >> $R <<'PY'
          import json, sys
          rows = {}
          for r in json.load(open(sys.argv[1])):
              rows.setdefault(r["n_threads"], {})["pp" if r["n_prompt"] else "tg"] = "%.2f ± %.2f" % (r["avg_ts"], r["stddev_ts"])
          for t in sorted(rows): print(f"| {sys.argv[2]} | {t} | {rows[t].get('pp')} | {rows[t].get('tg')} |")
          PY
          }
          ab "upstream (e3de715 kernels + OpenMP threading)" base
          abd "v0.1 kernels, OpenMP (v0.1 equivalent)" opt/bin/omp BONSAI_PQ2_REPACK=0
          abd "v0.2 4-row, OpenMP (v0.2 equivalent)" opt/bin/omp
          abd "v0.3 4-row, threadpool (default)" opt/bin
          abd "v0.3 threadpool + BONSAI_TG_NOBARRIER=1" opt/bin BONSAI_TG_NOBARRIER=1
          abd "v0.3 threadpool, pure spin (BONSAI_BARRIER_SPIN=-1)" opt/bin BONSAI_BARRIER_SPIN=-1
          abd "v0.3 threadpool, yield (BONSAI_BARRIER_SPIN=0)" opt/bin BONSAI_BARRIER_SPIN=0
          abd "v0.3 threadpool, ternary 4-row" opt/bin BONSAI_PQ2_TERNARY=1
          cat $R
      - name: barrier policy under oversubscription (2x more threads than vCPUs, like a loaded desktop)
        run: |
          R=results/real-oversub.md; N=$(nproc)
          { echo "### barrier policies, tg64, threads = $N (all vCPUs) and $((2 * N)) (oversubscribed), runner CPU - NOT Snapdragon X"; echo
            echo "| configuration | t=$N tg64 | t=$((2 * N)) tg64 |"; echo "|---|---|---|"; } > $R
          for v in "threadpool spin 4096 (default)|opt/bin|BONSAI_BARRIER_SPIN=4096" "threadpool spin 0 (yield)|opt/bin|BONSAI_BARRIER_SPIN=0" \
                   "threadpool spin 65536|opt/bin|BONSAI_BARRIER_SPIN=65536" "threadpool pure spin (-1, upstream)|opt/bin|BONSAI_BARRIER_SPIN=-1" \
                   "OpenMP (v0.2)|opt/bin/omp|BONSAI_BARRIER_SPIN=4096" "upstream OpenMP build|base/bin|BONSAI_BARRIER_SPIN=4096"; do
            IFS='|' read -r n d e <<< "$v"; row="| $n |"
            for t in $N $((2 * N)); do
              r=$(env $e LD_LIBRARY_PATH=$PWD/${d%/omp} BONSAI_BACKEND_DIR=$PWD/$d timeout 900 ${d%/omp}/llama-bench -m /models/bonsai.gguf -t $t -ngl 0 -p 0 -n 64 -r 2 -o json 2>/dev/null \
                  | python3 -c 'import json,sys; r=json.load(sys.stdin)[0]; print("%.2f ± %.2f" % (r["avg_ts"], r["stddev_ts"]))' || echo failed)
              row="$row $r |"
            done
            echo "$row" >> $R
          done
          cat $R
      - name: where decode time goes (BONSAI_PROFILE=1, tg64, 4 threads)
        run: |
          R=results/real-profile.md; echo "### graph profiler, tg64 on the runner CPU (NOT Snapdragon X)" > $R
          for v in "threadpool|opt/bin|-" "threadpool+nobarrier|opt/bin|BONSAI_TG_NOBARRIER=1" "OpenMP|opt/bin/omp|-"; do
            IFS='|' read -r n d e <<< "$v"; envs=(); [ "$e" != - ] && envs=($e)
            { echo; echo "#### $n"; echo '```'; } >> $R
            env "${envs[@]}" BONSAI_PROFILE=1 LD_LIBRARY_PATH=$PWD/opt/bin BONSAI_BACKEND_DIR=$PWD/$d opt/bin/llama-bench -m /models/bonsai.gguf \
              -t 4 -ngl 0 -p 0 -n 64 -r 1 2>&1 | grep -E 'bonsai-profile|tg64' >> $R
            echo '```' >> $R
          done
          cat $R
      - name: model load time and peak RSS (mmap vs no-mmap, 4-row vs plain layout)
        run: |
          R=results/real-load.md
          { echo "### load time and peak RSS, one 1-token run (runner, page cache warm after the first run)"; echo
            echo "| layout | load | wall s | peak RSS MiB |"; echo "|---|---|---|---|"; } > $R
          export LD_LIBRARY_PATH=$PWD/opt/bin BONSAI_BACKEND_DIR=$PWD/opt/bin
          opt/bin/llama-bench -m /models/bonsai.gguf -t 4 -ngl 0 -p 0 -n 1 -r 1 --no-warmup > /dev/null 2>&1
          for v in "4-row|1|1" "4-row|0|1" "plain (BONSAI_PQ2_REPACK=0)|1|0" "plain (BONSAI_PQ2_REPACK=0)|0|0"; do
            IFS='|' read -r lay mm rp <<< "$v"
            BONSAI_PQ2_REPACK=$rp /usr/bin/time -f '%e %M' -o /tmp/t opt/bin/llama-bench -m /models/bonsai.gguf -t 4 -ngl 0 -p 0 -n 1 -r 1 --no-warmup -mmp $mm > /dev/null 2>&1
            read -r w m < /tmp/t; echo "| $lay | $([ $mm = 1 ] && echo mmap || echo no-mmap) | $w | $((m / 1024)) |" >> $R
          done
          cat $R
      - name: "real-model server - chat, streaming and tool calling (OpenAI API)"
        continue-on-error: true
        run: |
          R=results/real-server.md; echo "### real-model OpenAI-compatible server checks" > $R; echo >> $R
          export LD_LIBRARY_PATH=$PWD/opt/bin BONSAI_BACKEND_DIR=$PWD/opt/bin
          opt/bin/llama-server -m /models/bonsai.gguf --alias bonsai -ngl 0 -c 4096 --jinja --port 18090 > /tmp/srv.log 2>&1 &
          SRV=$!
          for i in $(seq 1 600); do curl -sf http://127.0.0.1:18090/health >/dev/null && break; sleep 1; done
          grep -m1 'bonsai-oryon profile' /tmp/srv.log | sed 's/^/- /' >> $R
          curl -s http://127.0.0.1:18090/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"bonsai","temperature":0,"max_tokens":512,"messages":[{"role":"user","content":"What is the capital of France? Answer in one word."}]}' > /tmp/chat.json
          curl -sN http://127.0.0.1:18090/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"bonsai","temperature":0,"max_tokens":32,"stream":true,"messages":[{"role":"user","content":"Count from 1 to 5."}]}' > /tmp/stream.txt
          curl -s http://127.0.0.1:18090/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"bonsai","temperature":0,"max_tokens":256,"messages":[{"role":"user","content":"What is the weather in Paris right now? Use the tool."}],"tools":[{"type":"function","function":{"name":"get_weather","description":"Get the current weather for a city","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}]}' > /tmp/tools.json
          python3 - >> $R <<'PY'
          import json
          c = json.load(open("/tmp/chat.json"))["choices"][0]["message"]
          print(f"- chat: content {(c.get('content') or '')[:200]!r}, reasoning_content {len(c.get('reasoning_content') or '')} chars (answer contains 'Paris': {'paris' in ((c.get('content') or '') + (c.get('reasoning_content') or '')).lower()})")
          chunks = [l for l in open("/tmp/stream.txt") if l.startswith("data: {")]
          done = any(l.startswith("data: [DONE]") for l in open("/tmp/stream.txt"))
          text = "".join((json.loads(l[6:])["choices"][0]["delta"].get("content") or "") for l in chunks if json.loads(l[6:])["choices"])
          print(f"- streaming: {len(chunks)} SSE chunks, [DONE]: {done}, text {text[:120]!r}")
          m = json.load(open("/tmp/tools.json"))["choices"][0]
          tc = m["message"].get("tool_calls") or []
          print(f"- tool calling: finish_reason={m.get('finish_reason')}, tool_calls={[(t['function']['name'], t['function']['arguments']) for t in tc]}")
          PY
          kill $SRV || true
          cat $R
      - if: always()
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: real-model-results, path: results/ }

  profile:
    name: perf profile of token generation (runner CPU)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: { name: engine-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - run: mkdir -p opt && tar -C opt -xzf engine-bin.tgz
      - run: curl -fL --retry 5 -o model.gguf "$MODEL_URL"
      - name: perf record tg (v0.3 threadpool, barrier-free decode, v0.2 OpenMP)
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          cat > prof.sh <<'EOF'
          set -e
          apt-get update -qq && apt-get install -y -qq --no-install-recommends linux-perf libgomp1 >/dev/null
          export LD_LIBRARY_PATH=/w/opt/bin
          for v in v03-threadpool:/w/opt/bin:0 v03-nobarrier:/w/opt/bin:1 v02-openmp:/w/opt/bin/omp:0; do
            IFS=: read -r n d nb <<< "$v"
            BONSAI_BACKEND_DIR=$d BONSAI_TG_NOBARRIER=$nb perf record -q -F 1999 -o /w/$n.data -- \
              /w/opt/bin/llama-bench -m /w/model.gguf -t 4 -ngl 0 -p 0 -n 64 -r 1 >/w/$n.bench 2>&1
            echo "### $n (backend dir $d, BONSAI_TG_NOBARRIER=$nb): top symbols and DSOs, tg64, 4 threads"
            grep -E '^\|' /w/$n.bench | tail -1
            echo '```'
            perf report -q -i /w/$n.data --no-children --sort dso --stdio 2>/dev/null | grep -v '^$' | cut -c1-120 | head -8
            perf report -q -i /w/$n.data --no-children --sort symbol --stdio 2>/dev/null | grep -v '^$' | cut -c1-140 | head -25
            echo '```'
          done
          EOF
          docker run --rm --privileged -v "$PWD:/w" -w /w debian:trixie bash /w/prof.sh | tee profile.md
          cat profile.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tg-profile, path: profile.md }
