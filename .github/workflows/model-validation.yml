name: model-validation (opt-in, real 9B model)

# Manually triggered only. Downloads prism-ml/Ternary-Bonsai-2-9B-gguf / Ternary-Bonsai-2-9B-PQ2_0.gguf
# (about 2.4 GB) from Hugging Face onto the runner. Nothing is cached, uploaded or redistributed.
# Justification: the only way to check end-to-end numerical compatibility (KL divergence of
# full-vocabulary logits) of the optimized kernels against unpatched upstream kernels on the REAL
# model, and to get like-for-like A/B numbers on ARM64 hardware. The runner is a generic
# 4-vCPU Arm Neoverse N2 VM, so these are NOT Snapdragon X numbers.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Run ID of a successful build-test-release run whose engine-bin/baseline-bin artifacts to use'
        required: true

permissions:
  contents: read
  actions: read

env:
  MODEL_URL: https://huggingface.co/prism-ml/Ternary-Bonsai-2-9B-gguf/resolve/main/Ternary-Bonsai-2-9B-PQ2_0.gguf

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates python3 python3-numpy python3-yaml curl libgomp1
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/download-artifact@v4
        with: { name: engine-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { name: baseline-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - run: mkdir -p opt base && tar -C opt -xzf engine-bin.tgz && tar -C base -xzf baseline-bin.tgz
      - name: download model (not redistributed)
        run: |
          mkdir -p /models
          curl -fL --retry 5 -o /models/bonsai.gguf "$MODEL_URL"
          ls -la /models; sha256sum /models/bonsai.gguf
      - name: inspect tensor types and PQ2_0 code usage (is the checkpoint strictly ternary?)
        continue-on-error: true
        run: |
          mkdir -p results
          python3 - <<'PY' | tee results/model-tensors.md
          import sys, collections
          import numpy as np
          sys.path.insert(0, "upstream/llama.cpp/gguf-py")
          import gguf
          r = gguf.GGUFReader("/models/bonsai.gguf")
          arch = r.fields["general.architecture"]; print("architecture:", bytes(arch.parts[arch.data[0]]).decode())
          by = collections.defaultdict(lambda: [0, 0])
          codes = np.zeros(4, dtype=np.int64)
          for t in r.tensors:
              by[t.tensor_type.name][0] += 1; by[t.tensor_type.name][1] += int(t.n_bytes)
              if t.tensor_type.name == "PQ2_0":
                  raw = np.asarray(t.data, dtype=np.uint8).reshape(-1, 34)[:, 2:]
                  for j in range(4):
                      codes += np.bincount(((raw >> (2 * j)) & 3).ravel(), minlength=4)
          print("| type | tensors | MiB |\n|---|---|---|")
          for k, (n, b) in sorted(by.items(), key=lambda kv: -kv[1][1]): print(f"| {k} | {n} | {b/2**20:.1f} |")
          tot = codes.sum()
          print("\nPQ2_0 code histogram (value = code-1):", {f"{c-1:+d}": f"{codes[c]/tot*100:.3f}%" for c in range(4)})
          print("strictly ternary (no +2 codes):", codes[3] == 0)
          for t in r.tensors:
              if t.name in ("token_embd.weight", "output.weight"): print(f"- {t.name}: {t.tensor_type.name} {list(t.shape)}")
          PY
      - name: numerical compatibility on the real model (KL divergence vs unpatched kernels)
        run: |
          cat upstream/llama.cpp/README.md upstream/llama.cpp/docs/build.md > /tmp/text.txt
          echo "### real-model numerical compatibility, v0.2 default kernels vs unpatched e3de715 kernels" > results/real-numerics.md
          BASE_BACKEND_DIR=$PWD/base/bin OPT_BACKEND_DIR=$PWD/opt/bin THREADS=4 CTX=256 CHUNKS=4 MAX_KLD=0.001 MIN_TOP1=98 \
            tests/numerics/compare-kld.sh base/bin/llama-perplexity opt/bin/llama-perplexity /models/bonsai.gguf /tmp/text.txt results/real-numerics.md
      - name: numerical compatibility, opt-in ternary layout vs unpatched kernels
        run: |
          echo "### real-model numerical compatibility, ternary 4-row layout (BONSAI_PQ2_TERNARY=1) vs unpatched e3de715 kernels" > results/real-numerics-ternary.md
          BONSAI_PQ2_TERNARY=1 BASE_BACKEND_DIR=$PWD/base/bin OPT_BACKEND_DIR=$PWD/opt/bin THREADS=4 CTX=256 CHUNKS=4 MAX_KLD=0.001 MIN_TOP1=98 \
            tests/numerics/compare-kld.sh base/bin/llama-perplexity opt/bin/llama-perplexity /models/bonsai.gguf /tmp/text.txt results/real-numerics-ternary.md
      - name: A/B on the real model, threads 1/2/4 (runner CPU, 3 reps)
        run: |
          R=results/real-ab.md
          { echo "### real-model A/B, $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU - NOT Snapdragon X"; echo
            echo "| build | threads | pp256 tok/s | tg128 tok/s |"; echo "|---|---|---|---|"; } > $R
          ab() { # label dir env...
            lab=$1; d=$2; shift 2; l=$(echo "$lab" | tr -c 'A-Za-z0-9\n' '_')
            env "$@" LD_LIBRARY_PATH=$PWD/$d/bin BONSAI_BACKEND_DIR=$PWD/$d/bin $d/bin/llama-bench -m /models/bonsai.gguf \
              -t 1,2,4 -ngl 0 -p 256 -n 128 -r 3 -o json > /tmp/$l.json 2>/tmp/$l.log || { tail /tmp/$l.log; return 1; }
            python3 - /tmp/$l.json "$lab" >> $R <<'PY'
          import json, sys
          rows = {}
          for r in json.load(open(sys.argv[1])):
              rows.setdefault(r["n_threads"], {})["pp" if r["n_prompt"] else "tg"] = "%.2f ± %.2f" % (r["avg_ts"], r["stddev_ts"])
          for t in sorted(rows): print(f"| {sys.argv[2]} | {t} | {rows[t].get('pp')} | {rows[t].get('tg')} |")
          PY
          }
          ab "upstream kernels (e3de715 + 0003/0004)" base
          ab "v0.1 path (BONSAI_PQ2_REPACK=0)" opt BONSAI_PQ2_REPACK=0
          ab "v0.2 4-row layout (default)" opt
          ab "v0.2 ternary 4-row (BONSAI_PQ2_TERNARY=1)" opt BONSAI_PQ2_TERNARY=1
          cat $R
      - if: always()
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: real-model-results, path: results/ }

  profile:
    name: perf profile of token generation (runner CPU)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: { name: engine-bin, run-id: '${{ inputs.ci_run_id }}', github-token: '${{ github.token }}' }
      - run: mkdir -p opt && tar -C opt -xzf engine-bin.tgz
      - run: curl -fL --retry 5 -o model.gguf "$MODEL_URL"
      - name: perf record tg (v0.2 default and v0.1 path)
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          cat > prof.sh <<'EOF'
          set -e
          apt-get update -qq && apt-get install -y -qq --no-install-recommends linux-perf libgomp1 >/dev/null
          export LD_LIBRARY_PATH=/w/opt/bin BONSAI_BACKEND_DIR=/w/opt/bin
          for v in v02:1:0 v01:0:0 v02ternary:1:1; do
            n=${v%%:*}; rt=${v#*:}; BONSAI_PQ2_TERNARY=${rt#*:} BONSAI_PQ2_REPACK=${rt%%:*} perf record -q -F 1999 -o /w/$n.data -- \
              /w/opt/bin/llama-bench -m /w/model.gguf -t 4 -ngl 0 -p 0 -n 64 -r 1 >/w/$n.bench 2>&1
            echo "### $n (BONSAI_PQ2_REPACK=${rt%%:*} BONSAI_PQ2_TERNARY=${rt#*:}): top symbols and DSOs, tg64, 4 threads"
            grep -E '^\|' /w/$n.bench | tail -1
            echo '```'
            perf report -q -i /w/$n.data --no-children --sort dso --stdio 2>/dev/null | grep -v '^$' | cut -c1-120 | head -8
            perf report -q -i /w/$n.data --no-children --sort symbol --stdio 2>/dev/null | grep -v '^$' | cut -c1-140 | head -25
            echo '```'
          done
          EOF
          docker run --rm --privileged -v "$PWD:/w" -w /w debian:trixie bash /w/prof.sh | tee profile.md
          cat profile.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tg-profile, path: profile.md }
